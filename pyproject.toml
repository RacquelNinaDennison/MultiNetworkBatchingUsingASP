[project]
name = "multibatch"
version = "0.1.0"
description = "Multi-commodity network batching solvers using Answer Set Programming"
requires-python = ">=3.11"
dependencies = [
    "clingo>=5.6",
    "clingcon>=5.2",
    "pydantic>=2.0",
    "scipy>=1.10",
    "pandas>=3.0.3",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "numpy>=2.4.5",
    "ipykernel>=7.2.0",
    "ortools>=9.15.6755",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
vis = [
    "pyvis>=0.3",
]
experiments = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.scripts]
multibatch = "multibatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multibatch"]

[tool.ruff]
target-version = "py311"
line-length = 100
